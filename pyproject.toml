[project]
name = "tiny-consistent-ring"
version = "0.1.0"
description = "Consistent hash ring using virtual nodes to distribute keys across a dynamic set of nodes with minimal disruption."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
